[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "livesub"
version = "0.1.0"
description = "Windows 即時語音翻譯字幕（英／日／韓 → 繁體中文）"
requires-python = ">=3.11"
# 相依套件統一由 requirements*.txt 管理（方便 GPU / 開發環境分開安裝）
dependencies = []

[project.scripts]
livesub = "livesub.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "BLE"]
ignore = ["S101", "S311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
